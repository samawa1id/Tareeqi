<title>Tareeqi – Smarter Roads. Safer Lives.</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Poppins:wght@700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0B2D5B;--blue:#0EA5E9;--orange:#F97316;--grey:#E5E7EB;--mute:#5B6B82;--stage:#E5E7EB;--sink:#0B2D5B;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--stage:#071a36;--sink:#E5E7EB}}
:root[data-theme="dark"]{--stage:#071a36;--sink:#E5E7EB}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:Inter,system-ui,sans-serif;background:var(--stage);color:var(--sink);display:flex;gap:40px;align-items:center;justify-content:center;padding:20px}
h1,h2,h3,.pop{font-family:Poppins,Inter,sans-serif;font-weight:700}
.side{max-width:230px;font-size:14px;line-height:1.55}.side h1{font-size:28px;margin-bottom:8px}
.phone{width:390px;height:810px;max-height:100%;background:#fff;color:var(--navy);border-radius:38px;border:9px solid var(--navy);overflow:hidden;display:flex;flex-direction:column;position:relative;box-shadow:0 20px 50px rgba(11,45,91,.28)}
.scr{flex:1;overflow-y:auto;padding:16px 18px 14px}.scr::-webkit-scrollbar{display:none}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:8px;font:700 20px Poppins;color:var(--navy)}
.pill{font:600 11.5px Inter;padding:5px 10px;border-radius:99px;background:#E0F4FD;color:#075985}.pill.off{background:var(--grey);color:#4A5A72}
.btn{font:600 15px Inter;border:0;border-radius:12px;padding:14px 16px;background:var(--blue);color:var(--navy);width:100%;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.navy{background:var(--navy);color:#fff}.btn.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--grey)}.btn[disabled]{opacity:.55;cursor:default}
.btn:active{transform:scale(.98)}button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
h2{font-size:22px;line-height:1.2;margin-bottom:4px}h3{font-size:15px;margin:2px 0 8px}
.sub{font-size:13.5px;color:var(--mute);line-height:1.45;margin-bottom:14px}
.hero{background:var(--navy);color:#fff;border-radius:18px;padding:20px 18px;margin-bottom:14px}.hero h2{font-size:25px;color:#fff}.hero p{font-size:13.5px;opacity:.88;margin:6px 0 16px;line-height:1.45}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}.stats div{background:var(--grey);border-radius:12px;padding:10px}.stats b{font:700 20px Poppins;display:block}.stats span{font-size:11.5px;color:var(--mute)}.stats .o b{color:#C2570C}
.row{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--grey);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;font:inherit;color:inherit}
.ic{width:38px;height:38px;border-radius:10px;background:#FFF1E6;color:#C2570C;display:grid;place-items:center;flex:none}.ic.b{background:#E0F4FD;color:#0A6E9C}.ic.g{background:var(--grey);color:#4A5A72}
.row p{font-size:14px;font-weight:600}.row small{font-size:12px;color:var(--mute)}.row .go{margin-left:auto;font-size:11.5px;color:var(--mute);text-align:right;flex:none}
.tag{font:600 11px Inter;padding:4px 8px;border-radius:99px;background:#FFF1E6;color:#9A3F05;white-space:nowrap}.tag.ok{background:#DFF5E8;color:#17713F}.tag.bl{background:#E0F4FD;color:#075985}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.cat{border:1.5px solid var(--grey);background:#fff;border-radius:12px;padding:12px 4px;font:600 12.5px Inter;color:var(--navy);display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}.cat.on{border-color:var(--blue);background:#E0F4FD}
.seg{display:flex;background:var(--grey);border-radius:12px;padding:3px;margin-bottom:14px}.seg button{flex:1;border:0;background:transparent;border-radius:10px;padding:9px;font:600 13px Inter;color:#4A5A72;cursor:pointer}.seg button.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.photo{border:1.5px dashed #AEB9C8;border-radius:12px;padding:14px;display:flex;align-items:center;gap:12px;color:var(--mute);font-size:13px;margin-bottom:14px;cursor:pointer;background:#F8FAFC}
.photo img{width:64px;height:64px;object-fit:cover;border-radius:10px}.photo input{display:none}
textarea{width:100%;border:1.5px solid var(--grey);border-radius:12px;padding:12px;font:400 14px Inter;color:var(--navy);height:68px;resize:none;margin-bottom:14px}
.map{border-radius:16px;overflow:hidden;border:1px solid var(--grey);margin-bottom:12px;line-height:0}.map svg{width:100%;height:auto;display:block}
.addr{display:flex;gap:10px;align-items:center;background:var(--grey);border-radius:12px;padding:12px;margin-bottom:10px;font-size:13px;line-height:1.35}.addr b{display:block;font-size:14px}
.chips{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}.chip{border:1.5px solid var(--grey);background:#fff;border-radius:99px;padding:6px 12px;font:600 12.5px Inter;color:var(--navy);white-space:nowrap;cursor:pointer}.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.track{display:flex;margin:12px 0 2px}.track div{flex:1;text-align:center;font-size:10.5px;color:var(--mute);position:relative}
.track div:before{content:"";display:block;width:14px;height:14px;border-radius:50%;background:var(--grey);margin:0 auto 5px;position:relative;z-index:1}
.track div:after{content:"";position:absolute;top:6px;left:-50%;width:100%;height:2px;background:var(--grey)}.track div:first-child:after{display:none}
.track .d:before,.track .d:after{background:var(--blue)}.track .d{color:var(--navy);font-weight:600}.track .c:before{background:var(--orange);box-shadow:0 0 0 4px #FDE0CB}
.rep{border:1px solid var(--grey);border-radius:14px;padding:14px;margin-bottom:10px;cursor:pointer;width:100%;background:#fff;text-align:left;font:inherit;color:inherit;display:block}.rep .h{display:flex;justify-content:space-between;gap:8px}.rep p{font-weight:600;font-size:14.5px}.rep small{font-size:12px;color:var(--mute)}
.tlogo{height:48px;width:auto;display:block;margin:-4px 0 -4px -6px}
.nav{display:grid;grid-template-columns:repeat(5,1fr);justify-items:center;align-items:center;border-top:1px solid var(--grey);padding:8px 4px 12px;background:#fff}
.nav button{border:0;background:none;font:600 11px Inter;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:4px 8px}.nav button.on{color:#0A6E9C}
.nav .fab{background:var(--orange);color:#fff;width:52px;height:52px;border-radius:50%;margin-top:-26px;justify-content:center;border:4px solid #fff;padding:0}
.toast{position:absolute;left:16px;right:16px;top:16px;background:var(--navy);color:#fff;border-radius:12px;padding:12px 14px;font-size:13.5px;z-index:30;animation:t .3s}@keyframes t{from{transform:translateY(-14px);opacity:0}}
.bd{position:absolute;inset:0;background:rgba(11,45,91,.45);z-index:20;display:flex;align-items:flex-end}
.sheet{background:#fff;border-radius:22px 22px 0 0;padding:18px;width:100%;max-height:86%;overflow-y:auto}
.sheet img.p{width:100%;height:150px;object-fit:cover;border-radius:12px;margin-bottom:12px}
.sw{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--grey);border-radius:12px;padding:14px;margin-bottom:12px;font-size:13.5px}.sw b{display:block;font-size:14px}
.tg{width:48px;height:28px;border-radius:99px;border:0;background:#AEB9C8;position:relative;cursor:pointer;flex:none}.tg:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s}.tg.on{background:var(--blue)}.tg.on:after{left:23px}
.splash{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:28px;text-align:center;gap:14px}.splash img{width:100%;max-width:310px}.splash p{font-size:14px;color:var(--mute);max-width:260px}
.empty{text-align:center;padding:26px 10px;color:var(--mute);font-size:14px}
@media (prefers-reduced-motion:reduce){.toast{animation:none}.tg:after{transition:none}}
@media (max-width:760px){body{padding:0;display:block}.side{display:none}.phone{width:100%;height:100%;max-height:none;border:0;border-radius:0;box-shadow:none}}
</style>
</head>
<body>
<aside class="side"><h1>Tareeqi</h1><p>Working MVP of the app. Report a hazard, confirm others’ reports and follow repairs. On the Profile tab, turn on Authority mode to move reports through each repair stage.</p></aside>

const ic=(n,s=22)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]}</svg>`;
const cic=t=>(CATS.find(c=>c[0]===t)||CATS[5])[1];
const pts=l=>l.map(([a,o])=>P(a,o).map(n=>n.toFixed(1)).join(',')).join(' ');
function dseg(p,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],t=Math.max(0,Math.min(1,((p[0]-a[0])*dx+(p[1]-a[1])*dy)/(dx*dx+dy*dy)));return Math.hypot(p[0]-a[0]-t*dx,p[1]-a[1]-t*dy)}
function where(x,y){let best=[1e9,''];for(const[n,l]of ROADS){const q=l.map(([a,o])=>P(a,o));for(let i=0;i<q.length-1;i++){const d=dseg([x,y],q[i],q[i+1]);if(d<best[0])best=[d,n]}}
 const dn=DIST.map(([n,a,o])=>{const[px,py]=P(a,o);return[Math.hypot(px-x,py-y),n]}).sort((a,b)=>a[0]-b[0])[0][1];return best[0]<16?best[1]+', '+dn:'Near '+dn}
const BASE=`<rect width="360" height="460" fill="#EEF1F4"/><polyline points="${pts(NILE)}" fill="none" stroke="#CDE9F8" stroke-width="30" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="${P(30.057,31.222)[0]}" cy="${P(30.057,31.222)[1]}" rx="5" ry="16" fill="#DCEFE2"/>
<g fill="none" stroke-linecap="round" stroke-linejoin="round">${['#C9D0DA|9','#fff|6.500'].map(s=>{const[c,w]=s.split('|');return `<g stroke="${c}" stroke-width="${w}">${ROADS.map(r=>`<polyline points="${pts(r[1])}"/>`).join('')}</g>`}).join('')}</g>
<g font-family="Inter" font-size="8.500" fill="#7B8798">${DIST.map(([n,a,o])=>{const[x,y]=P(a,o);return `<text x="${x+6}" y="${y-5}">${n}</text><circle cx="${x}" cy="${y}" r="2" fill="#A5AFBD"/>`}).join('')}<text x="${P(30.1,31.222)[0]-34}" y="${P(30.1,31.222)[1]}" fill="#3E86B0" font-style="italic">River Nile</text></g>`;
const col=r=>r.stage>2?'#9AA6B6':r.sev==='Low'?'#0EA5E9':'#F97316';
function mapSVG(id,list,pin){const pk=pin?(()=>{const[x,y]=P(pin[0],pin[1]);return `<g transform="translate(${x} ${y})"><circle r="18" fill="#0EA5E9" opacity=".2"/><path d="M0 4c-3-8-11-12-11-20a11 11 0 0 1 22 0c0 8-8 12-11 20z" fill="#F97316" stroke="#fff" stroke-width="2"/><circle cy="-16" r="4" fill="#fff"/></g>`})():'';
 return `<svg viewBox="0 0 360 460" id="${id}" role="img" aria-label="Map of Greater Cairo">${BASE}${list.map(r=>{const[x,y]=P(r.lat,r.lng),on=S.sel===r.id;return `<g class="mk" data-a="open" data-v="${r.id}" tabindex="0" style="cursor:pointer" transform="translate(${x.toFixed(1)} ${y.toFixed(1)})"><circle r="${on?20:14}" fill="${col(r)}" opacity=".2"/><circle r="8" fill="${col(r)}" stroke="#fff" stroke-width="2.500"/></g>`}).join('')}${pk}</svg>`}
const NOW=1793473200000,H=36e5;
const DEMO=[
 {id:'d1',t:'Pothole',sev:'High',lat:29.96,lng:31.259,street:'Corniche El Nile, Maadi',desc:'Deep pothole in the right lane.',ts:NOW-50*H,stage:2,conf:Array.from({length:14},(_,i)=>'u'+i),by:'demo'},
 {id:'d2',t:'Flooding',sev:'High',lat:30.004,lng:31.1975,street:'Faisal St, Giza',desc:'Standing water after rain.',ts:NOW-20*H,stage:1,conf:Array.from({length:9},(_,i)=>'u'+i),by:'demo'},
 {id:'d3',t:'Damaged sign',sev:'Medium',lat:30.045,lng:31.285,street:'Salah Salem Rd, Nasr City',desc:'Stop sign bent at the junction.',ts:NOW-9*H,stage:1,conf:Array.from({length:5},(_,i)=>'u'+i),by:'demo'},
 {id:'d4',t:'Streetlight',sev:'Low',lat:30.0632,lng:31.225,street:'26th of July Corridor, Zamalek',desc:'Light out for a full block.',ts:NOW-5*H,stage:0,conf:['u1','u2','u3'],by:'demo'},
 {id:'d5',t:'Cracked road',sev:'High',lat:29.9505,lng:31.22,street:'Ring Road, Maadi',desc:'Wide crack across two lanes.',ts:NOW-3*H,stage:0,conf:Array.from({length:7},(_,i)=>'u'+i),by:'demo'},
 {id:'d6',t:'Pothole',sev:'Medium',lat:30.053,lng:31.241,street:'Ramses St, Tahrir',desc:'Patched by the district crew.',ts:NOW-120*H,stage:3,conf:Array.from({length:11},(_,i)=>'u'+i),by:'demo'}];
const S={scr:'splash',cat:null,sev:1,photo:null,desc:'',pin:null,sel:null,filter:'All',auth:false,toast:'',reports:[],uid:null,col:null,sync:'local'};
const app=$('#app');
const ago=t=>{const m=(Date.now()-t)/6e4;return m<1?'just now':m<60?Math.round(m)+' min ago':m<1440?Math.round(m/60)+' h ago':Math.round(m/1440)+' d ago'};
const lget=k=>{try{return localStorage.getItem(k)}catch(e){return null}},lset=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
function loadLocal(){try{S.reports=JSON.parse(lget('tq_reports'))||DEMO.map(d=>({...d}))}catch(e){S.reports=DEMO.map(d=>({...d}))}}
const saveLocal=()=>{if(!S.col)lset('tq_reports',JSON.stringify(S.reports))};
const mine=()=>S.reports.filter(r=>r.by===S.uid).sort((a,b)=>b.ts-a.ts);
const open=()=>S.reports.filter(r=>r.stage<3).sort((a,b)=>b.ts-a.ts);
const trk=s=>`<div class="track">${STG.map((n,i)=>`<div class="${i<=s?'d':''} ${i===s&&s<3?'c':''}">${n}</div>`).join('')}</div>`;
const rowR=r=>`<button class="row" data-a="open" data-v="${r.id}"><div class="ic ${r.stage>2?'g':r.sev==='Low'?'b':''}">${ic(cic(r.t))}</div><div><p>${r.t}</p><small>${r.street}</small></div><div class="go"><span class="tag ${r.stage>2?'ok':r.sev==='Low'?'bl':''}">${r.stage>2?'Repaired':r.sev}</span><br>${r.conf.length} confirmed</div></button>`;
const topbar=()=>`<div class="top"><img class="tlogo" src="${LOGO}" alt="Tareeqi"><span class="pill ${S.sync==='live'?'':'off'}">${S.sync==='live'?'Live sync':'Offline mode'}</span></div>`;
function view(){
 const o=open(),m=mine();
 if(S.scr==='home')return `${topbar()}<div class="hero"><h2>Smarter Roads. Safer Lives.</h2><p>See a hazard in Cairo, Giza or Alexandria? Report it in under a minute and follow the repair.</p><button class="btn" data-a="go" data-v="report" style="width:auto;padding:12px 18px">${ic('plus',18)}Report a problem</button></div>
 <div class="stats"><div class="o"><b>${o.length}</b><span>Open alerts</span></div><div><b>${m.length}</b><span>My reports</span></div><div><b>${S.reports.length-o.length}</b><span>Repaired</span></div></div>
 <h3>Latest road alerts</h3>${o.slice(0,5).map(rowR).join('')||'<p class="empty">No open alerts. Roads look clear.</p>'}<button class="btn ghost" data-a="go" data-v="alerts" style="margin-top:8px">Open alerts map</button>`;
 if(S.scr==='report')return `<h2>Report a problem</h2><p class="sub">Tell us what you see. It takes about a minute.</p>
 <div class="cats">${CATS.map((c,i)=>`<button class="cat ${S.cat===i?'on':''}" data-a="cat" data-v="${i}">${ic(c[1],24)}${c[0]}</button>`).join('')}</div>
 <h3>How dangerous is it?</h3><div class="seg">${SEV.map((s,i)=>`<button data-a="sev" data-v="${i}" class="${S.sev===i?'on':''}">${s}</button>`).join('')}</div>
 <label class="photo">${S.photo?`<img src="${S.photo}" alt="Your photo">`:ic('cam',26)}<div><b style="color:var(--navy);font-size:14px">${S.photo?'Photo added':'Add a photo'}</b><br>${S.photo?'Tap to replace':'Take or choose one. It helps crews find it.'}</div><input type="file" accept="image/*" capture="environment" id="file"></label>
 <textarea id="desc" placeholder="Add details (optional)" aria-label="Details">${S.desc}</textarea><button class="btn" data-a="loc">Next: choose location</button>`;
 if(S.scr==='loc'){const[a,o2]=S.pin,[x,y]=P(a,o2);return `<h2>Where is it?</h2><p class="sub">Tap the map to move the pin, or use your location.</p><div class="map">${mapSVG('pick',[],S.pin)}</div>
 <div class="addr"><span style="color:#C2570C">${ic('pin')}</span><div><b>${where(x,y)}</b>${a.toFixed(4)}, ${o2.toFixed(4)}</div></div>
 <div class="addr" style="background:#FFF1E6"><span style="color:#C2570C">${ic(CATS[S.cat][1])}</span><div><b>${CATS[S.cat][0]}</b>${SEV[S.sev]} risk${S.photo?' · 1 photo':''}</div></div>
 <button class="btn ghost" data-a="me" style="margin-bottom:8px">${ic('loc',18)}Use my location</button><button class="btn" data-a="submit">Submit report</button><button class="btn ghost" data-a="go" data-v="report" style="margin-top:8px">Back</button>`}
 if(S.scr==='alerts'){const f=['All','High risk','Pothole','Flooding'],L=o.filter(r=>S.filter==='All'||(S.filter==='High risk'?r.sev==='High':r.t===S.filter));
 return `<h2>Nearby road alerts</h2><p class="sub">${L.length} open hazards reported by drivers.</p><div class="chips">${f.map(x=>`<button class="chip ${S.filter===x?'on':''}" data-a="f" data-v="${x}">${x}</button>`).join('')}</div><div class="map">${mapSVG('almap',L)}</div>${L.map(rowR).join('')||'<p class="empty">No alerts match this filter.</p>'}`}
 if(S.scr==='mine')return `<h2>My reports</h2><p class="sub">Follow each report until the road is repaired.</p>${m.map(r=>`<button class="rep" data-a="open" data-v="${r.id}"><div class="h"><div><p>${r.t}</p><small>${r.street} · ${ago(r.ts)}</small></div><span class="tag ${r.stage>2?'ok':r.stage?'bl':''}">${STG[r.stage]}</span></div>${trk(r.stage)}</button>`).join('')||`<div class="empty">You haven’t reported anything yet.<br><br><button class="btn" data-a="go" data-v="report">Report your first problem</button></div>`}`;
 return `<h2>Profile</h2><p class="sub">Tareeqi MVP v0.1 · Greater Cairo pilot</p>
 <div class="sw"><div><b>Authority mode</b>Lets you move reports through Assigned and Repaired, as a roads department would.</div><button class="tg ${S.auth?'on':''}" data-a="auth" role="switch" aria-checked="${S.auth}" aria-label="Authority mode"></button></div>
 <div class="sw"><div><b>${S.sync==='live'?'Live sync is on':'Offline mode'}</b>${S.sync==='live'?'Reports are shared in real time with everyone who opens the app.':'Reports are saved on this device only.'}</div></div>
 ${S.sync==='live'?'':'<button class="btn ghost" data-a="reset">Reset demo data on this device</button>'}`}
function sheet(){const r=S.reports.find(x=>x.id===S.sel);if(!r)return'';const did=r.conf.includes(S.uid);
 return `<div class="bd" data-a="close"><div class="sheet" role="dialog" aria-label="${r.t}" onclick="event.stopPropagation()">${r.photo?`<img class="p" src="${r.photo}" alt="Photo of ${r.t}">`:''}
 <div style="display:flex;justify-content:space-between;gap:8px"><div><h2 style="font-size:19px">${r.t}</h2><p class="sub" style="margin:0">${r.street}</p></div><span class="tag ${r.stage>2?'ok':''}">${r.stage>2?'Repaired':SEV[SEV.indexOf(r.sev)]+' risk'}</span></div>
 <p class="sub" style="margin:10px 0 0">${r.desc||'No details added.'}</p><p class="sub" style="margin:4px 0 0">Reported ${ago(r.ts)} · ${r.conf.length} driver${r.conf.length>1?'s':''} confirmed</p>${trk(r.stage)}
 <div style="display:grid;gap:8px;margin-top:14px">${r.stage<3?`<button class="btn navy" data-a="conf" ${did?'disabled':''}>${ic('chk',18)}${did?'You confirmed this':'I see this too'}</button>`:''}
 ${S.auth&&r.stage<3?`<button class="btn" data-a="adv">Move to ${STG[r.stage+1]}</button>`:''}<button class="btn ghost" data-a="close">Close</button></div></div></div>`}
function tabs(){const b=(v,i,l)=>`<button data-a="go" data-v="${v}" class="${S.scr===v?'on':''}" aria-label="${l}">${ic(i)}${l}</button>`;return `<nav class="nav">${b('home','home','Home')}${b('alerts','bell','Alerts')}<button class="fab" data-a="go" data-v="report" aria-label="Report a problem">${ic('plus',26)}</button>${b('mine','list','My reports')}${b('me','user','Profile')}</nav>`}
function render(){const k=$('.scr'),top=k?k.scrollTop:0;
 app.innerHTML=(S.toast?`<div class="toast" role="status">${S.toast}</div>`:'')+(S.scr==='splash'?`<div class="splash"><img src="${LOGO}" alt="Tareeqi. Report it. Repair it. Protect everyone."><p>Smarter Roads. Safer Lives.</p><button class="btn" data-a="start" style="max-width:260px">Get started</button></div>`:`<div class="scr">${view()}</div>${sheet()}${tabs()}`);
 const n=$('.scr');if(n&&!S.fresh)n.scrollTop=top;S.fresh=0;const fi=$('#file');if(fi)fi.onchange=pick;const d=$('#desc');if(d)d.oninput=()=>S.desc=d.value}
function say(t){S.toast=t;render();clearTimeout(S.tt);S.tt=setTimeout(()=>{S.toast='';render()},2800)}
function go(v){S.scr=v;S.sel=null;S.fresh=1;render()}
function pick(e){const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{const s=Math.min(1,560/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);S.photo=c.toDataURL('image/jpeg',.6);render()};im.src=URL.createObjectURL(f)}
async function patch(r,p){Object.assign(r,p);if(S.col){try{await S.col.doc(r.id).update(p)}catch(e){say('Could not save the change. Check your connection.')}}else saveLocal();render()}
document.addEventListener('click',async e=>{
 const m=e.target.closest('#pick');if(m){const b=m.getBoundingClientRect(),x=(e.clientX-b.left)/b.width*B.W,y=(e.clientY-b.top)/b.height*B.H;S.pin=U(x,y);return render()}
 const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,v=t.dataset.v;
 if(a==='start')return go('home');if(a==='go')return go(v);
 if(a==='cat'){S.cat=+v;return render()}if(a==='sev'){S.sev=+v;return render()}
 if(a==='loc'){if(S.cat===null)return say('Choose what you saw first.');S.desc=($('#desc')||{}).value||S.desc;S.pin=S.pin||[30.0444,31.2357];return go('loc')}
 if(a==='me'){if(!navigator.geolocation)return say('Location is not available. Tap the map instead.');return navigator.geolocation.getCurrentPosition(p=>{let{latitude:la,longitude:lo}=p.coords,out=la<B.y0||la>B.y1||lo<B.x0||lo>B.x1;S.pin=out?[30.0444,31.2357]:[la,lo];say(out?'You are outside the Cairo pilot area. Pin placed in central Cairo.':'Pin moved to your location.')},()=>say('Location is blocked. Tap the map to place the pin.'),{timeout:7000})}
 if(a==='submit'){const[x,y]=P(S.pin[0],S.pin[1]),id='r'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),r={t:CATS[S.cat][0],sev:SEV[S.sev],lat:S.pin[0],lng:S.pin[1],street:where(x,y),desc:S.desc,ts:Date.now(),stage:0,conf:[S.uid],by:S.uid};if(S.photo)r.photo=S.photo;
  if(S.col){try{await S.col.doc(id).set(r)}catch(err){return say('Could not send the report. Please try again.')}}else{S.reports.push({id,...r});saveLocal()}
  S.cat=null;S.sev=1;S.photo=null;S.desc='';S.pin=null;S.scr='mine';S.fresh=1;return say('Report sent. Everyone nearby can now see it.')}
 if(a==='f'){S.filter=v;return render()}if(a==='open'){S.sel=v;return render()}if(a==='close'){S.sel=null;return render()}
 const r=S.reports.find(x=>x.id===S.sel);
 if(a==='conf'&&r&&!r.conf.includes(S.uid))return patch(r,{conf:[...r.conf,S.uid]});
 if(a==='adv'&&r&&r.stage<3)return patch(r,{stage:r.stage+1});
 if(a==='auth'){S.auth=!S.auth;return render()}
 if(a==='reset'){S.reports=DEMO.map(d=>({...d}));saveLocal();return say('Demo data restored.')}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList.contains('mk'))e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))});
(async()=>{S.uid=lget('tq_uid')||('u'+Math.random().toString(36).slice(2,9));lset('tq_uid',S.uid);loadLocal();render();
 try{const u=window.claude&&await claude.use('user');const id=u&&await u.id();if(id)S.uid=id}catch(e){}
 try{const d=window.claude&&await claude.use('db');if(d){const c=d.collection('reports');c.onSnapshot(s=>{S.col=c;S.sync='live';S.reports=s.docs.map(x=>({id:x.id,...x.data()}));if(S.scr!=='report'&&S.scr!=='loc')render()},()=>{S.col=null;S.sync='local';loadLocal();render()})}}catch(e){}})();
</script>
